name: Hourly cron triggers

# Azure App Service runs a long-lived Node process, so the in-process pollers in
# packages/api (startTrialExpiryPoller, startWatchRenewalPoller) normally work.
# But App Service can idle-stop or recycle the app (e.g. without "Always On"),
# which kills those intervals — so trials never flip to `expired` and watches
# aren't renewed. This scheduled workflow is the durable, external trigger:
# it calls the secured /internal/cron/* endpoints hourly, independent of whether
# the app process happens to be alive.
#
# Only hourly/daily-cadence jobs belong here. The per-minute jobs
# (send-scheduled, wake-snoozed) are intentionally left to the in-process
# pollers — GitHub Actions cannot reliably run every minute.
#
# Required repository secrets/vars:
#   secrets.CRON_SECRET      — must match the CRON_SECRET set on the App Service
#   vars.CRON_TARGET_URL     — deployment base URL, e.g.
#                              https://zer0email-prod-web.azurewebsites.net

on:
  schedule:
    # Top of every hour (UTC). GitHub schedules are best-effort and may be
    # delayed under load; hourly jobs tolerate that.
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      target_url:
        description: "Override base URL (defaults to vars.CRON_TARGET_URL)"
        required: false
        type: string

concurrency:
  group: cron-hourly
  cancel-in-progress: false

jobs:
  trigger:
    name: Trigger hourly cron endpoints
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Resolve target URL
        id: target
        env:
          INPUT_URL: ${{ inputs.target_url }}
          VAR_URL: ${{ vars.CRON_TARGET_URL }}
        run: |
          set -euo pipefail
          URL="${INPUT_URL:-$VAR_URL}"
          if [ -z "$URL" ]; then
            echo "::error::No target URL. Set the CRON_TARGET_URL repository variable or pass target_url."
            exit 1
          fi
          # Strip any trailing slash so we can safely append paths.
          URL="${URL%/}"
          echo "base=$URL" >> "$GITHUB_OUTPUT"

      - name: Expire due Pro trials
        env:
          BASE: ${{ steps.target.outputs.base }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/expire-trials.out -w "%{http_code}" \
            -X POST "$BASE/api/internal/cron/expire-trials" \
            -H "authorization: Bearer $CRON_SECRET")
          echo "expire-trials -> HTTP $code"
          cat /tmp/expire-trials.out || true
          echo
          if [ "$code" != "200" ]; then
            echo "::error::expire-trials returned HTTP $code"
            exit 1
          fi

      - name: Renew expiring mailbox watches
        env:
          BASE: ${{ steps.target.outputs.base }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/renew-watches.out -w "%{http_code}" \
            -X POST "$BASE/api/internal/cron/renew-watches" \
            -H "authorization: Bearer $CRON_SECRET")
          echo "renew-watches -> HTTP $code"
          cat /tmp/renew-watches.out || true
          echo
          if [ "$code" != "200" ]; then
            echo "::error::renew-watches returned HTTP $code"
            exit 1
          fi
