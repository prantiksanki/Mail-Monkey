name: deploy-prod (EC2)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  ECR_REPO: 522317845919.dkr.ecr.ap-south-1.amazonaws.com/popsuites
  AWS_REGION: ap-south-1
  INSTANCE_ID: i-0401f517d2bf50d2b

jobs:
  secret-scan:
    name: Scan for leaked secrets (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest \
            detect --source="/repo" --verbose --redact --exit-code=1

  build-and-deploy:
    name: Build image and deploy to EC2
    needs: secret-scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: https://www.popsuites.ai
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::522317845919:role/github-deploy-prod
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ env.ECR_REPO }}:app-${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_SITE_URL=${{ secrets.NEXT_PUBLIC_SITE_URL }}
            NEXT_PUBLIC_DOCS_URL=${{ secrets.NEXT_PUBLIC_DOCS_URL }}
            NEXT_PUBLIC_ENZUZO_COOKIEBAR_ID=${{ secrets.NEXT_PUBLIC_ENZUZO_COOKIEBAR_ID }}
            NEXT_PUBLIC_AVATARS_BUCKET_NAME=${{ secrets.NEXT_PUBLIC_AVATARS_BUCKET_NAME }}
            NEXT_PUBLIC_GOOGLE_ANALYTICS_ID=${{ secrets.NEXT_PUBLIC_GOOGLE_ANALYTICS_ID }}
            NEXT_PUBLIC_GOOGLE_TAG_MANAGER_ID=${{ secrets.NEXT_PUBLIC_GOOGLE_TAG_MANAGER_ID }}
            NEXT_PUBLIC_PRICE_ID_STARTER_MONTHLY=${{ secrets.NEXT_PUBLIC_PRICE_ID_STARTER_MONTHLY }}
            NEXT_PUBLIC_PRICE_ID_STARTER_YEARLY=${{ secrets.NEXT_PUBLIC_PRICE_ID_STARTER_YEARLY }}
            NEXT_PUBLIC_PRICE_ID_PREMIUM_MONTHLY=${{ secrets.NEXT_PUBLIC_PRICE_ID_PREMIUM_MONTHLY }}
            NEXT_PUBLIC_PRICE_ID_PREMIUM_YEARLY=${{ secrets.NEXT_PUBLIC_PRICE_ID_PREMIUM_YEARLY }}
            NEXT_PUBLIC_PRICE_ID_PRO_MONTHLY=${{ secrets.NEXT_PUBLIC_PRICE_ID_PRO_MONTHLY }}
            NEXT_PUBLIC_PRICE_ID_PRO_YEARLY=${{ secrets.NEXT_PUBLIC_PRICE_ID_PRO_YEARLY }}
          secrets: |
            database_url=${{ secrets.DATABASE_URL }}
            direct_url=${{ secrets.DIRECT_URL }}
            better_auth_secret=${{ secrets.BETTER_AUTH_SECRET }}
          no-cache: true

      - uses: pnpm/action-setup@v4
        with:
          version: "10.28.2"

      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply database migrations
        # Without this, schema changes merged into the app never reached the
        # prod DB and every query touching them failed with P2021/P2022 (empty
        # inbox, 500s on inbox/list). Runs before the new image goes live.
        run: pnpm --filter database exec prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}

      - name: Deploy on server via SSM
        run: |
          CMD=$(aws ssm send-command --instance-ids ${{ env.INSTANCE_ID }} --document-name AWS-RunShellScript \
            --parameters "commands=[\"sudo -u ec2-user bash -lc 'bash /opt/popsuites/deploy/deploy-prod.sh app-${{ github.sha }}'\"],executionTimeout=[\"1800\"]" \
            --query Command.CommandId --output text)
          STATUS=Pending
          for i in $(seq 1 90); do
            STATUS=$(aws ssm get-command-invocation --command-id "$CMD" --instance-id ${{ env.INSTANCE_ID }} --query Status --output text 2>/dev/null || echo Pending)
            case $STATUS in Success|Failed|Cancelled|TimedOut) break ;; esac
            sleep 10
          done
          aws ssm get-command-invocation --command-id "$CMD" --instance-id ${{ env.INSTANCE_ID }} --query StandardOutputContent --output text
          aws ssm get-command-invocation --command-id "$CMD" --instance-id ${{ env.INSTANCE_ID }} --query StandardErrorContent --output text
          test "$STATUS" = Success
