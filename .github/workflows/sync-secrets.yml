name: sync-secrets
on: workflow_dispatch
jobs:
  sync:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1
      - env:
          ALL: ${{ toJSON(secrets) }}
        run: |
          echo "$ALL" | jq 'with_entries(select(.key | test("^(AZURE_|NEXT_PUBLIC_|github_token)") | not))' > gh.json
          aws secretsmanager get-secret-value --secret-id popsuites/prod \
            --query SecretString --output text > aws.json 2>/dev/null || echo '{}' > aws.json
          jq -s '.[1] * .[0]' aws.json gh.json > merged.json
          aws secretsmanager put-secret-value --secret-id popsuites/prod --secret-string file://merged.json
          jq 'keys' merged.json
          rm -f gh.json aws.json merged.json