name: Deploy to AWS

# Every push to main: scan for secrets, build the Docker image, push it to
# ECR, and roll it out on the EC2 server via SSM. One-time setup is in
# aws/README.md; until the AWS_DEPLOY_ROLE_ARN variable exists, the deploy
# job is skipped instead of failing.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-aws
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'ap-south-1' }}

jobs:
  secret-scan:
    name: Scan for leaked secrets (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest \
            detect --source="/repo" --verbose --redact --exit-code=1

  deploy:
    name: Build image and deploy to EC2
    needs: secret-scan
    if: vars.AWS_DEPLOY_ROLE_ARN != ''
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: production
      url: ${{ vars.APP_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ vars.ECR_REPOSITORY_URI }}:${{ github.sha }}
            ${{ vars.ECR_REPOSITORY_URI }}:latest
          build-args: |
            NEXT_PUBLIC_SITE_URL=${{ vars.APP_URL }}
            NEXT_PUBLIC_DOCS_URL=${{ vars.NEXT_PUBLIC_DOCS_URL }}
            NEXT_PUBLIC_AVATARS_BUCKET_NAME=${{ vars.NEXT_PUBLIC_AVATARS_BUCKET_NAME }}
            NEXT_PUBLIC_PRICE_ID_STARTER_MONTHLY=${{ vars.NEXT_PUBLIC_PRICE_ID_STARTER_MONTHLY }}
            NEXT_PUBLIC_PRICE_ID_STARTER_YEARLY=${{ vars.NEXT_PUBLIC_PRICE_ID_STARTER_YEARLY }}
            NEXT_PUBLIC_PRICE_ID_PRO_MONTHLY=${{ vars.NEXT_PUBLIC_PRICE_ID_PRO_MONTHLY }}
            NEXT_PUBLIC_PRICE_ID_PRO_YEARLY=${{ vars.NEXT_PUBLIC_PRICE_ID_PRO_YEARLY }}
            NEXT_PUBLIC_PRICE_ID_PREMIUM_MONTHLY=${{ vars.NEXT_PUBLIC_PRICE_ID_PREMIUM_MONTHLY }}
            NEXT_PUBLIC_PRICE_ID_PREMIUM_YEARLY=${{ vars.NEXT_PUBLIC_PRICE_ID_PREMIUM_YEARLY }}
            NEXT_PUBLIC_PRICE_ID_VOICE_ADDON=${{ vars.NEXT_PUBLIC_PRICE_ID_VOICE_ADDON }}
          # Build-time only (prisma generate, Better Auth init); BuildKit
          # secrets never end up in an image layer.
          secrets: |
            database_url=${{ secrets.DATABASE_URL }}
            direct_url=${{ secrets.DIRECT_URL }}
            better_auth_secret=${{ secrets.BETTER_AUTH_SECRET }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Bring the database schema up to date before the new code goes live.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Apply database migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: |
          pnpm install --frozen-lockfile --filter "@repo/database..."
          pnpm --filter @repo/database exec prisma migrate deploy

      - name: Deploy on EC2 via SSM
        env:
          IMAGE: ${{ vars.ECR_REPOSITORY_URI }}:${{ github.sha }}
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
        run: |
          # Ship the deploy script inline (gzip keeps the SSM command small).
          script_b64=$(gzip -9c aws/server-deploy.sh | base64 -w0)
          params=$(jq -n --arg cmd \
            "echo $script_b64 | base64 -d | gunzip > /tmp/mailmonkey-deploy.sh && bash /tmp/mailmonkey-deploy.sh '$IMAGE' '$AWS_REGION'" \
            '{commands: [$cmd], executionTimeout: ["1500"]}')
          cmd_id=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "Deploy ${GITHUB_SHA::7}" \
            --parameters "$params" \
            --query Command.CommandId --output text)
          echo "SSM command: $cmd_id"

          status=Pending
          for _ in $(seq 1 180); do
            sleep 10
            status=$(aws ssm get-command-invocation --command-id "$cmd_id" \
              --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)
            case "$status" in Pending|InProgress|Delayed) continue ;; *) break ;; esac
          done

          aws ssm get-command-invocation --command-id "$cmd_id" --instance-id "$INSTANCE_ID" \
            --query '[StandardOutputContent, StandardErrorContent]' --output text || true
          echo "Deploy status: $status"
          [ "$status" = "Success" ]
