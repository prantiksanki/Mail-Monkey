AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Mail Monkey hosting: one EC2 server running the web app in Docker behind
  Caddy (automatic HTTPS on <elastic-ip>.sslip.io), an ECR repository for the
  images, and a GitHub OIDC role so GitHub Actions can deploy without stored
  AWS keys. See aws/README.md.

Parameters:
  GitHubRepo:
    Type: String
    Default: prantiksanki/Mail-Monkey
    Description: GitHub repository (owner/name) allowed to deploy.
  GitHubRepoWithIds:
    Type: String
    Default: prantiksanki@144121988/Mail-Monkey@1404325986
    Description: >
      Same repository in GitHub's immutable-ID form (owner@ownerId/repo@repoId),
      which GitHub now uses in the OIDC subject claim.
  GitHubBranch:
    Type: String
    Default: main
    Description: Only pushes to this branch can deploy.
  InstanceType:
    Type: String
    Default: t3.small
    AllowedValues: [t3.micro, t3.small, t3.medium]
    Description: t3.small (2 GB RAM) is the smallest size that runs the app comfortably.
  CreateGitHubOidcProvider:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: >
      Set to false if this AWS account already has the
      token.actions.githubusercontent.com identity provider.
  EnvParameterName:
    Type: String
    Default: /mailmonkey/prod/env
    Description: SSM Parameter Store SecureString holding the app's .env contents.
  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64

Conditions:
  CreateOidc: !Equals [!Ref CreateGitHubOidcProvider, "true"]

Resources:
  EcrRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: mailmonkey
      ImageScanningConfiguration:
        ScanOnPush: true
      LifecyclePolicy:
        LifecyclePolicyText: |
          {"rules":[{"rulePriority":1,"description":"Keep the last 10 images",
            "selection":{"tagStatus":"any","countType":"imageCountMoreThan","countNumber":10},
            "action":{"type":"expire"}}]}

  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: CreateOidc
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]
      ThumbprintList: [6938fd4d98bab03faadb97b34396831e3780aea1]

  # Assumed by GitHub Actions (OIDC): push images and trigger the deploy.
  GitHubDeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: mailmonkey-github-deploy
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If
                - CreateOidc
                - !Ref GitHubOidcProvider
                - !Sub arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                # Jobs that use a GitHub environment (deploy-aws.yml uses
                # "production") present the environment, not the branch.
                # GitHub may send the repo by name or with immutable IDs.
                token.actions.githubusercontent.com:sub:
                  - !Sub repo:${GitHubRepo}:ref:refs/heads/${GitHubBranch}
                  - !Sub repo:${GitHubRepo}:environment:production
                  - !Sub repo:${GitHubRepoWithIds}:ref:refs/heads/${GitHubBranch}
                  - !Sub repo:${GitHubRepoWithIds}:environment:production
      Policies:
        - PolicyName: push-and-deploy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: "*"
              - Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:BatchGetImage
                  - ecr:CompleteLayerUpload
                  - ecr:GetDownloadUrlForLayer
                  - ecr:InitiateLayerUpload
                  - ecr:PutImage
                  - ecr:UploadLayerPart
                Resource: !GetAtt EcrRepository.Arn
              - Effect: Allow
                Action: ssm:SendCommand
                Resource:
                  - !Sub arn:aws:ssm:${AWS::Region}::document/AWS-RunShellScript
                  - !Sub arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:instance/${AppInstance}
              - Effect: Allow
                Action:
                  - ssm:GetCommandInvocation
                  - ssm:ListCommandInvocations
                Resource: "*"

  # Used by the EC2 server: SSM agent, pulling images, reading the .env.
  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: pull-image-and-env
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: "*"
              - Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:BatchGetImage
                  - ecr:GetDownloadUrlForLayer
                Resource: !GetAtt EcrRepository.Arn
              - Effect: Allow
                Action: ssm:GetParameter
                Resource: !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${EnvParameterName}

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref InstanceRole]

  # Only HTTP/HTTPS are open; administration goes through SSM, not SSH.
  WebSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Mail Monkey web (HTTP/HTTPS)
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: 0.0.0.0/0 }
        - { IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0 }
        - { IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIpv6: "::/0" }
        - { IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIpv6: "::/0" }

  AppInstance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref LatestAmiId
      InstanceType: !Ref InstanceType
      IamInstanceProfile: !Ref InstanceProfile
      SecurityGroupIds: [!GetAtt WebSecurityGroup.GroupId]
      MetadataOptions:
        HttpTokens: required
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize: 30
            VolumeType: gp3
            Encrypted: true
      Tags:
        - { Key: Name, Value: mailmonkey-prod }
      UserData:
        Fn::Base64: |
          #!/bin/bash
          set -euxo pipefail
          dnf install -y docker
          mkdir -p /usr/local/lib/docker/cli-plugins
          curl -fsSL "https://github.com/docker/compose/releases/download/v2.29.7/docker-compose-linux-x86_64" \
            -o /usr/local/lib/docker/cli-plugins/docker-compose
          chmod +x /usr/local/lib/docker/cli-plugins/docker-compose
          systemctl enable --now docker
          # 2 GB swap so a t3.small survives memory spikes.
          fallocate -l 2G /swapfile && chmod 600 /swapfile && mkswap /swapfile && swapon /swapfile
          echo '/swapfile none swap sw 0 0' >> /etc/fstab
          mkdir -p /opt/mailmonkey

  # Fixed public IP, so the sslip.io hostname (and Google OAuth URLs) never change.
  AppElasticIp:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc
      InstanceId: !Ref AppInstance

Outputs:
  AppUrl:
    Description: Public HTTPS URL of the app (set as the APP_URL GitHub variable).
    Value: !Sub https://${AppElasticIp}.sslip.io
  DeployRoleArn:
    Description: Set as the AWS_DEPLOY_ROLE_ARN GitHub variable.
    Value: !GetAtt GitHubDeployRole.Arn
  EcrRepositoryUri:
    Description: Set as the ECR_REPOSITORY_URI GitHub variable.
    Value: !GetAtt EcrRepository.RepositoryUri
  InstanceId:
    Description: Set as the EC2_INSTANCE_ID GitHub variable.
    Value: !Ref AppInstance
